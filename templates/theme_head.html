{% load static %}
{% if scope == "public" %}
<script>
    // Let fresh page loads start at the top instead of restoring an old scroll position.
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";
</script>
{% endif %}
<script src="{% static 'color-theme.js' %}" data-theme-scope="{{ scope }}"></script>
<link rel="stylesheet" href="{% static 'color-theme.css' %}">
