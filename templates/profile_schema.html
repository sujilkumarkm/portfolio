{% load static %}
{% static 'portfolio-portrait.jpg' as portrait_path %}
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@graph": [
        {
            "@type": "WebSite",
            "@id": "{{ site_origin }}/#website",
            "url": "{{ site_origin }}/",
            "alternateName": ["Sujil", "Sujul", "Sujil Kumar"],
            "name": "{{ site_name }}"
        },
        {
            "@type": "ProfilePage",
            "@id": "{{ page_url }}#profile",
            "url": "{{ page_url }}",
            "isPartOf": {"@id": "{{ site_origin }}/#website"},
            "mainEntity": {"@id": "{{ site_origin }}/#person"}
        },
        {
            "@type": "Person",
            "@id": "{{ site_origin }}/#person",
            "name": "{{ site_name }}",
            "url": "{{ site_origin }}/",
            "alternateName": ["Sujil Kumar", "Sujil", "Sujul"],
            "jobTitle": "Senior Technical Support Expert",
            "description": "Application and IT support engineer based in Dundalk, Ireland, with experience in software development, web development, data analytics and agentic AI research. Aspiring CEO.",
            "homeLocation": {"@type": "Place", "name": "Dundalk, County Louth, Ireland"},
            "worksFor": {"@type": "Organization", "name": "Kaseya"},
            "knowsAbout": ["Application support", "IT support", "Software development", "Web development", "Python", "Django", "SQL", "Data analytics", "Agentic AI"],
            "image": "{{ site_origin }}{{ portrait_path }}",
            "sameAs": [
                "https://github.com/sujilkumarkm",
                "https://www.linkedin.com/in/sujil"
            ]
        }
    ]
}
</script>
