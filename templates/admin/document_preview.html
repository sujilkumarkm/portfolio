    <dialog class="document-preview" aria-labelledby="document-preview-title">
      <div class="document-preview-header">
        <h2 id="document-preview-title">PDF preview</h2>
        <form method="dialog"><button type="submit" autofocus>Close</button></form>
      </div>
      <iframe title="PDF document preview"></iframe>
      <div class="document-preview-controls">
        <button type="button" data-preview-previous>Previous PDF</button>
        <span data-preview-position role="status"></span>
        <button type="button" data-preview-next>Next PDF</button>
        <a class="document-preview-download" href="">Download PDF</a>
      </div>
    </dialog>
