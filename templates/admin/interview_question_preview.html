<dialog class="document-preview interview-question-preview" aria-labelledby="interview-question-preview-title">
  <div class="document-preview-header">
    <h2 id="interview-question-preview-title">Document preview</h2>
    <form method="dialog"><button type="submit" autofocus>Close</button></form>
  </div>
  <iframe title="Read-only interview question preview" sandbox="" referrerpolicy="no-referrer"></iframe>
  <div class="document-preview-controls">
    <button type="button" data-interview-preview-previous>Previous</button>
    <span data-interview-preview-position role="status"></span>
    <button type="button" data-interview-preview-next>Next</button>
    <a class="document-preview-download" href="">Download document</a>
  </div>
</dialog>
