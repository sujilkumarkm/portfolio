{% load static %}
{% static share_image as share_image_path %}
{% with image_alt="Sujil Mani's portrait with the portfolio topics application support, Python and Django, and agentic AI" %}
<title>{{ page_title }}</title>
<meta name="description" content="{{ description }}">
<meta name="robots" content="max-image-preview:large">
<link rel="canonical" href="{{ page_url }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site_name }}">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ page_url }}">
<meta property="og:image" content="{{ site_origin }}{{ share_image_path }}">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ image_alt }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page_title }}">
<meta name="twitter:description" content="{{ description }}">
<meta name="twitter:image" content="{{ site_origin }}{{ share_image_path }}">
<meta name="twitter:image:alt" content="{{ image_alt }}">
{% endwith %}
<link rel="icon" type="image/png" sizes="96x96" href="{% static 'favicon-v2.png' %}">
<link rel="apple-touch-icon" sizes="180x180" href="{% static 'apple-touch-icon-v2.png' %}">
